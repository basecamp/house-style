Security/SanitizerAttributesUnset:
  Description: >-
    Sanitizer/scrubber classes that set an allowed-tags list must also set an
    allowed-attributes list; otherwise attribute filtering falls back to Loofah's
    default HTML5 allowlist instead of an explicit, narrower policy.
  Enabled: true
  VersionAdded: "1.3"

Security/UnsafeHtmlOnDynamicSubstrate:
  Description: >-
    Do not mark dynamically generated HTML (markdown rendering, syntax
    highlighting, string interpolation, user-derived values) as html_safe/raw.
  Enabled: true
  VersionAdded: "1.3"
